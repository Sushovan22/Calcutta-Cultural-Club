<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Community gathering</title>
  <desc id="desc">A festive pink floral rangoli with white lotus petals and warm diya lights.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#dcd2c6"/>
    </radialGradient>
    <linearGradient id="petalPink" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5fcf"/>
      <stop offset="40%" stop-color="#d83eff"/>
      <stop offset="100%" stop-color="#a61f8d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe9a5"/>
      <stop offset="100%" stop-color="#d59d19"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#b77a7d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bgGlow)"/>

